# Banco descartável para desenvolvimento e testes locais. NÃO é o compose do servidor (deploy/).
# Os dados ficam em memória: somem quando o container para.
name: vermogen-dev
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: vermogen
      POSTGRES_USER: vermogen
      POSTGRES_PASSWORD: vermogen_dev
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vermogen -d vermogen"]
      interval: 2s
      timeout: 3s
      retries: 30
